<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Values Workshop — demo film stage</title>
    <link rel="stylesheet" href="/product/tokens.css" />
    <link rel="stylesheet" href="/stage/stage.css" />
  </head>
  <body data-layout="title">
    <div class="film">
      <div class="topBar">
        <span class="wordmark">
          <svg class="brandMark" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9H3v-9a9 9 0 0 1 9-9Z"
              fill="currentColor"
              transform="rotate(-45 12 12)"
            />
          </svg>
          <span>Values Workshop</span>
        </span>
        <span class="eyebrow" id="eyebrow"></span>
      </div>

      <div class="devices">
        <div class="panel wallPanel">
          <div class="wallFrame"><img id="wallImage" alt="" /></div>
        </div>
        <div class="panel phonePanel">
          <div class="phoneFrame"><img id="phoneImage" alt="" /></div>
        </div>
        <div class="panel laptopPanel">
          <div class="laptopFrame"><img id="laptopImage" alt="" /></div>
          <div class="laptopBase"></div>
        </div>
      </div>

      <div class="caption">
        <span class="captionRule"></span>
        <span class="captionText" id="caption"></span>
      </div>

      <div class="card titleCard">
        <svg class="cardMark" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3a9 9 0 0 1 9 9 9 9 0 0 1-9 9H3v-9a9 9 0 0 1 9-9Z"
            fill="currentColor"
            transform="rotate(-45 12 12)"
          />
        </svg>
        <span class="cardName">Values Workshop</span>
        <span class="cardLine">
          A facilitated two-hour workshop that ends in everyday actions
        </span>
      </div>

      <div class="card outroCard">
        <span class="cardName">Values Workshop</span>
        <span class="cardLine">
          Next.js · ASP.NET Core · SignalR · EF Core · SQLite · Docker
        </span>
        <span class="cardLink">github.com/JakobKrummeich/ValuesWorkshop</span>
      </div>

      <div class="progressTrack"><div class="progressBar"></div></div>
    </div>
  </body>
</html>
